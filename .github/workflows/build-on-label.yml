name: Build on label

on:
  pull_request:
    types: [labeled]

jobs:
  build:
    if: contains(github.event.label.name, 'local build')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: bash build/build-free.sh
      - uses: actions/upload-artifact@v4
        with:
          name: vireo-analytics-${{ github.head_ref }}
          path: dist/vireo-analytics.zip
